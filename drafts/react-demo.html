    :root {
      --red: #C8102E;
      --red-dark: #a00d24;
      --navy: #041E42;
      --navy-light: #0a2d5e;
      --ice: #e8f0f9;

      --font-head: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --max-w: 1200px;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--off-white); color: var(--navy); line-height: 1.6; overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    a { color: var(--red); text-decoration: none; }

    /* Utility animations */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideIn { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes countUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(200,16,46,.3)} 50%{box-shadow:0 0 40px rgba(200,16,46,.6)} }
    @keyframes marquee { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    .animate-in { animation: slideUp .6s ease-out both; }
    .animate-in-delay-1 { animation-delay: .1s; }
    .animate-in-delay-2 { animation-delay: .2s; }
    .animate-in-delay-3 { animation-delay: .3s; }

       ══════════════════════════════════════════════ */

    function useOnScreen(ref, threshold = 0.15) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
      }, [ref, threshold]);
      return visible;
    }

    function useCountUp(end, duration = 1500, trigger = true) {
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (!trigger) return;
        let start = 0;
        const step = end / (duration / 16);
        const id = setInterval(() => {
          start += step;
          if (start >= end) { setVal(end); clearInterval(id); }
          else setVal(Math.floor(start));
        }, 16);
        return () => clearInterval(id);
      }, [end, duration, trigger]);
      return val;
    }

    /* ── Hero ─────────────────────────────────── */
    function Hero() {
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

        const { clientX, clientY, currentTarget } = e;
        const { left, top, width, height } = currentTarget.getBoundingClientRect();

          {/* Content */}

    function HeroStats() {
      const ref = useRef(null);
      const visible = useOnScreen(ref);
      const wins = useCountUp(39, 1200, visible);
      const players = useCountUp(32, 1200, visible);
      const tourneys = useCountUp(8, 800, visible);

      const stats = [
        { num: wins, label: 'Wins', color: 'var(--green)' },
        { num: 10, label: 'Losses', color: 'var(--red)' },
        { num: 3, label: 'Ties', color: 'var(--gold)' },
        { num: players, label: 'Players', color: '#fff' },
        { num: tourneys, label: 'Tourneys', color: '#fff' },
      ];

      return (
        <div ref={ref} style={{
          display: 'inline-flex', flexWrap: 'wrap', justifyContent: 'center',
          background: 'rgba(255,255,255,.08)', border: '1px solid rgba(255,255,255,.15)',
          borderRadius: 12, overflow: 'hidden',
        }}>
          {stats.map((s, i) => (
            <React.Fragment key={i}>
              {i > 0 && <div style={{ width: 1, background: 'rgba(255,255,255,.12)', alignSelf: 'stretch' }}></div>}
              <div style={{ padding: '16px 28px', textAlign: 'center', animation: visible ? `countUp .5s ease-out ${i * .1}s both` : 'none' }}>
                <div style={{ fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '1.8rem', color: s.color, lineHeight: 1 }}>{s.num}</div>
                <div style={{ fontSize: '.65rem', color: 'rgba(255,255,255,.45)', textTransform: 'uppercase', letterSpacing: '.12em', fontWeight: 600, marginTop: 4 }}>{s.label}</div>
              </div>
            </React.Fragment>
          ))}
        </div>
      );
    }

              }} onMouseOver={e => { e.currentTarget.style.transform = 'translateY(-6px)'; e.currentTarget.style.boxShadow = '0 12px 30px rgba(4,30,66,.15)'; }}
                 onMouseOut={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 20px rgba(4,30,66,.08)'; }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>{q.icon}</div>
                <div style={{ fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '1.1rem', color: 'var(--navy)', textTransform: 'uppercase' }}>{q.label}</div>
                <div style={{ fontSize: '.85rem', color: 'var(--gray)', marginTop: 4 }}>{q.desc}</div>
              </a>
            ))}
          </div>
        </section>
      );
    }

    /* ── Section Header ──────────────────────── */
    function SectionHeader({ title, sub, light }) {
      return (
        <div style={{ marginBottom: 40, textAlign: 'center' }}>
          <h2 style={{
            fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: 'clamp(2rem, 4vw, 3rem)',
            textTransform: 'uppercase', color: light ? '#fff' : 'var(--navy)',
            letterSpacing: '.03em', lineHeight: 1, marginBottom: 8,
          }}>{title}</h2>
          <div style={{ width: 60, height: 4, background: 'var(--red)', borderRadius: 2, margin: '0 auto 12px' }}></div>
          {sub && <p style={{ color: light ? 'rgba(255,255,255,.6)' : 'var(--gray)', fontSize: '1rem' }}>{sub}</p>}
        </div>
      );
    }

    /* ── Teams ────────────────────────────────── */
    function TeamsSection() {
      const ref = useRef(null);
      const visible = useOnScreen(ref);

      return (
        <section id="teams" ref={ref} style={{ padding: '80px 24px', background: 'var(--off-white)' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <SectionHeader title="Our Teams" sub="Competitive travel hockey on Long Island" />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: 28 }}>
              {TEAMS.map((t, i) => (
                <div key={i} style={{
                  background: '#fff', borderRadius: 16, overflow: 'hidden',
                  boxShadow: '0 4px 24px rgba(4,30,66,.08)', transition: 'all .3s',
                  animation: visible ? `slideUp .6s ease-out ${i * .15}s both` : 'none',
                }}
                  onMouseOver={e => { e.currentTarget.style.transform = 'translateY(-8px)'; e.currentTarget.style.boxShadow = '0 16px 40px rgba(4,30,66,.15)'; }}
                  onMouseOut={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 4px 24px rgba(4,30,66,.08)'; }}>
                  {/* Card header */}
                  <div style={{
                    background: `linear-gradient(135deg, var(--navy) 0%, ${t.color} 150%)`,
                    padding: '28px 28px 20px', position: 'relative', overflow: 'hidden',
                  }}>
                    <div style={{ position: 'absolute', top: -10, right: -10, fontSize: 80, opacity: .1 }}>{t.emoji}</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', position: 'relative', zIndex: 1 }}>
                      <div>
                        <h3 style={{ fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '1.6rem', color: '#fff', textTransform: 'uppercase', lineHeight: 1, marginBottom: 4 }}>{t.name}</h3>
                        <div style={{ fontSize: '.8rem', color: 'rgba(255,255,255,.6)' }}>{t.age} · {t.level}</div>
                      </div>
                      <div style={{ fontSize: 44 }}>{t.emoji}</div>
                    </div>
                    {/* Record bar */}
                    <div style={{ display: 'flex', gap: 12, marginTop: 16 }}>
                      {[
                        { n: t.record.w, l: 'W', bg: 'rgba(22,163,74,.25)', c: '#4ade80' },
                        { n: t.record.l, l: 'L', bg: 'rgba(220,38,38,.25)', c: '#f87171' },
                        { n: t.record.t, l: 'T', bg: 'rgba(255,215,0,.25)', c: 'var(--gold)' },
                      ].map((r, j) => (
                        <div key={j} style={{ background: r.bg, borderRadius: 6, padding: '6px 14px', textAlign: 'center' }}>
                          <div style={{ fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '1.2rem', color: r.c, lineHeight: 1 }}>{r.n}</div>
                          <div style={{ fontSize: '.6rem', color: 'rgba(255,255,255,.5)', textTransform: 'uppercase', letterSpacing: '.1em', marginTop: 2 }}>{r.l}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                  {/* Card body */}
                  <div style={{ padding: 28 }}>
                    <div style={{ fontSize: '.85rem', marginBottom: 16 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid var(--gray-light)' }}>
                        <span style={{ color: 'var(--gray)' }}>Head Coach</span>
                        <strong>{t.coach}</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid var(--gray-light)' }}>
                        <span style={{ color: 'var(--gray)' }}>Assistant</span>
                        <strong>{t.asst}</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0' }}>
                        <span style={{ color: 'var(--gray)' }}>Roster Size</span>
                        <strong>{t.players} players</strong>
                      </div>
                    </div>
                    <div style={{ fontFamily: 'var(--font-head)', fontWeight: 700, fontSize: '.8rem', textTransform: 'uppercase', color: 'var(--navy)', letterSpacing: '.05em', marginBottom: 8 }}>Season Highlights</div>
                    {t.highlights.map((h, j) => (
                      <div key={j} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: '.85rem', color: 'var(--gray)', padding: '4px 0' }}>
                        <span style={{ color: 'var(--red)', fontWeight: 700 }}>▸</span> {h}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Recent Results ───────────────────────── */
    function RecentResults() {
      const ref = useRef(null);
      const visible = useOnScreen(ref);
      const resultColor = { W: 'var(--green)', L: 'var(--red)', T: 'var(--gold)' };

      return (
        <section ref={ref} style={{ background: 'var(--ice)', padding: '64px 24px' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <SectionHeader title="Recent Results" sub="How we've been playing" />
            <div style={{ display: 'flex', gap: 16, overflowX: 'auto', paddingBottom: 12, scrollSnapType: 'x mandatory' }}>
              {RESULTS.map((r, i) => (
                <div key={i} style={{
                  flex: '0 0 200px', background: '#fff', borderRadius: 12, padding: 20,
                  boxShadow: '0 2px 12px rgba(4,30,66,.06)',
                  borderTop: `4px solid ${resultColor[r.result]}`,
                  scrollSnapAlign: 'start', transition: 'all .25s',
                  animation: visible ? `slideUp .5s ease-out ${i * .1}s both` : 'none',
                }}
                  onMouseOver={e => { e.currentTarget.style.transform = 'translateY(-4px)'; }}
                  onMouseOut={e => { e.currentTarget.style.transform = 'translateY(0)'; }}>
                  <div style={{ fontSize: '.7rem', color: 'var(--gray)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 8 }}>vs · {r.team}</div>
                  <div style={{ fontWeight: 700, color: 'var(--navy)', fontSize: '.9rem', marginBottom: 12 }}>{r.opp}</div>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '1.6rem', color: 'var(--navy)' }}>{r.score}</div>
                    <div style={{
                      width: 32, height: 32, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: resultColor[r.result], color: '#fff',
                      fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '.8rem',
                    }}>{r.result}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Schedule ─────────────────────────────── */
    function Schedule() {
      const [filter, setFilter] = useState('All');
      const ref = useRef(null);
      const visible = useOnScreen(ref);

      const filtered = filter === 'All' ? GAMES
        : GAMES.filter(g => g.home.includes(filter) || g.away.includes(filter));

      return (
        <section id="schedule" ref={ref} style={{ padding: '80px 24px', background: '#fff' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <SectionHeader title="Upcoming Games" sub="Spring 2026 schedule" />

            <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap', marginBottom: 32 }}>
              {['All', '10U', '14U'].map(f => (
                <button key={f} onClick={() => setFilter(f)} style={{
                  padding: '10px 28px', borderRadius: 8, cursor: 'pointer', transition: 'all .2s',
                  fontFamily: 'var(--font-head)', fontWeight: 700, fontSize: '.85rem',
                  textTransform: 'uppercase', letterSpacing: '.06em', border: 'none',
                  background: filter === f ? 'var(--navy)' : 'var(--off-white)',
                  color: filter === f ? '#fff' : 'var(--navy)',
                }}>{f === 'All' ? '🏒 All Games' : f}</button>
              ))}
            </div>

            <div style={{ display: 'grid', gap: 12 }}>
              {filtered.map((g, i) => {
                const isHome = g.home.includes('Rinx');
                return (
                  <div key={i} style={{
                    display: 'grid', gridTemplateColumns: '80px 1fr auto',
                    alignItems: 'center', gap: 20, padding: '18px 24px',
                    background: 'var(--off-white)', borderRadius: 12,
                    borderLeft: `4px solid ${g.type === 'tournament' ? 'var(--gold)' : 'var(--red)'}`,
                    transition: 'all .2s',
                    animation: visible ? `slideIn .4s ease-out ${i * .08}s both` : 'none',
                  }}
                    onMouseOver={e => { e.currentTarget.style.background = 'var(--ice)'; }}
                    onMouseOut={e => { e.currentTarget.style.background = 'var(--off-white)'; }}>
                    <div style={{ textAlign: 'center' }}>
                      <div style={{ fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '1.2rem', color: 'var(--navy)', lineHeight: 1 }}>{g.date.split(' ')[1]}</div>
                      <div style={{ fontSize: '.7rem', color: 'var(--gray)', textTransform: 'uppercase', fontWeight: 600 }}>{g.date.split(' ')[0]}</div>
                      <div style={{ fontSize: '.7rem', color: 'var(--red)', fontWeight: 700, marginTop: 2 }}>{g.day}</div>
                    </div>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                        <span style={{ fontWeight: 700, fontSize: '.95rem', color: isHome ? 'var(--navy)' : 'var(--gray)' }}>{g.home}</span>
                        <span style={{ fontSize: '.75rem', color: 'var(--gray)', fontWeight: 600 }}>vs</span>
                        <span style={{ fontWeight: 700, fontSize: '.95rem', color: !isHome ? 'var(--navy)' : 'var(--gray)' }}>{g.away}</span>
                      </div>
                      <div style={{ display: 'flex', gap: 12, fontSize: '.8rem', color: 'var(--gray)' }}>
                        <span>📍 {g.rink}</span>
                        <span>🕐 {g.time}</span>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: 8 }}>
                      <span style={{
                        fontSize: '.65rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.08em',
                        padding: '4px 10px', borderRadius: 20,
                        background: isHome ? '#dcfce7' : '#fee2e2',
                        color: isHome ? '#166534' : '#991b1b',
                      }}>{isHome ? 'Home' : 'Away'}</span>
                      {g.type === 'tournament' && (
                        <span style={{
                          fontSize: '.65rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.08em',
                          padding: '4px 10px', borderRadius: 20, background: '#fef3c7', color: '#92400e',
                        }}>🏆 Tourney</span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    /* ── News ─────────────────────────────────── */
    function NewsSection() {
      const [expanded, setExpanded] = useState(null);
      const ref = useRef(null);
      const visible = useOnScreen(ref);

      return (
        <section id="news" ref={ref} style={{ padding: '80px 24px', background: 'var(--off-white)' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <SectionHeader title="Club News" sub="Latest from Rinx Hockey Club" />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 20 }}>
              {NEWS.map((n, i) => (
                <div key={i} onClick={() => setExpanded(expanded === i ? null : i)} style={{
                  background: '#fff', borderRadius: 12, overflow: 'hidden', cursor: 'pointer',
                  boxShadow: '0 2px 12px rgba(4,30,66,.06)', transition: 'all .3s',
                  borderTop: `4px solid ${n.hot ? 'var(--red)' : 'transparent'}`,
                  animation: visible ? `slideUp .5s ease-out ${i * .1}s both` : 'none',
                }}
                  onMouseOver={e => { e.currentTarget.style.transform = 'translateY(-4px)'; e.currentTarget.style.boxShadow = '0 8px 24px rgba(4,30,66,.12)'; }}
                  onMouseOut={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 2px 12px rgba(4,30,66,.06)'; }}>
                  <div style={{ padding: '24px 24px 20px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
                      <span style={{
                        background: n.hot ? 'var(--red)' : 'var(--navy)', color: '#fff',
                        fontSize: '.65rem', fontWeight: 700, textTransform: 'uppercase',
                        letterSpacing: '.12em', padding: '4px 10px', borderRadius: 20,
                      }}>{n.tag}</span>
                      {n.hot && <span style={{ fontSize: '.7rem', animation: 'pulse 1.5s ease-in-out infinite' }}>🔥</span>}
                      <span style={{ fontSize: '.75rem', color: 'var(--gray)', marginLeft: 'auto' }}>{n.date}</span>
                    </div>
                    <h3 style={{
                      fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '1.15rem',
                      color: 'var(--navy)', textTransform: 'uppercase', lineHeight: 1.2, marginBottom: 8,
                    }}>{n.title}</h3>
                    <p style={{
                      fontSize: '.9rem', color: 'var(--gray)', lineHeight: 1.6,
                      maxHeight: expanded === i ? 200 : 0, overflow: 'hidden',
                      transition: 'max-height .3s ease-out', margin: 0,
                    }}>{n.body}</p>
                    <div style={{ fontSize: '.8rem', color: 'var(--red)', fontWeight: 700, marginTop: 8, fontFamily: 'var(--font-head)', textTransform: 'uppercase', letterSpacing: '.05em' }}>
                      {expanded === i ? '▾ Less' : '▸ Read More'}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Sponsors ─────────────────────────────── */
    function SponsorsSection() {
      const ref = useRef(null);
      const visible = useOnScreen(ref);
      const tierColor = { Platinum: 'var(--navy)', Gold: '#b45309', Silver: 'var(--gray)', Bronze: '#92400e' };
      const tierBg = { Platinum: 'var(--ice)', Gold: '#fef3c7', Silver: '#f3f4f6', Bronze: '#fef3c7' };

      return (
        <section ref={ref} style={{ padding: '64px 24px', background: '#fff' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <SectionHeader title="Our Sponsors" sub="Thank you to our amazing supporters" />
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 16, justifyContent: 'center' }}>
              {SPONSORS.map((s, i) => (
                <div key={i} style={{
                  background: tierBg[s.tier], borderRadius: 12, padding: '20px 28px',
                  textAlign: 'center', minWidth: 180, position: 'relative', transition: 'all .25s',
                  animation: visible ? `slideUp .4s ease-out ${i * .08}s both` : 'none',
                }}
                  onMouseOver={e => { e.currentTarget.style.transform = 'translateY(-3px)'; }}
                  onMouseOut={e => { e.currentTarget.style.transform = 'translateY(0)'; }}>
                  <div style={{
                    position: 'absolute', top: 8, right: 10, fontSize: '.55rem', fontWeight: 800,
                    textTransform: 'uppercase', letterSpacing: '.1em', color: tierColor[s.tier], opacity: .6,
                  }}>{s.tier}</div>
                  <div style={{ fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '.95rem', color: 'var(--navy)', textTransform: 'uppercase' }}>{s.name}</div>
                </div>
              ))}
            </div>
            <div style={{ textAlign: 'center', marginTop: 32 }}>
              <a href="#" style={{
                display: 'inline-block', padding: '12px 28px', borderRadius: 8,
                border: '2px solid var(--navy)', color: 'var(--navy)',
                fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '.9rem',
                textTransform: 'uppercase', letterSpacing: '.08em', textDecoration: 'none',
                transition: 'all .2s',
              }}>Become a Sponsor →</a>
            </div>
          </div>
        </section>
      );
    }

    /* ── CTA Banner ───────────────────────────── */
    function CTABanner() {
      return (
        <section style={{
          background: 'linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 50%, var(--red-dark) 100%)',
          padding: '80px 24px', textAlign: 'center', position: 'relative', overflow: 'hidden',
        }}>
          <div style={{ position: 'absolute', inset: 0, opacity: .05, fontSize: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>🏒</div>
          <div style={{ position: 'relative', zIndex: 1, maxWidth: 600, margin: '0 auto' }}>
            <h2 style={{
              fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: 'clamp(2rem, 5vw, 3rem)',
              color: '#fff', textTransform: 'uppercase', lineHeight: 1, marginBottom: 16,
            }}>Ready to Hit the Ice?</h2>
            <p style={{ color: 'rgba(255,255,255,.7)', fontSize: '1.05rem', marginBottom: 32, lineHeight: 1.6 }}>
              Join Rinx Hockey Club for the 2026-2027 season. Spots are filling fast — don't wait!
            </p>
            <div style={{ display: 'flex', gap: 16, justifyContent: 'center', flexWrap: 'wrap' }}>
              <a href="#" style={{
                background: 'var(--red)', color: '#fff', padding: '16px 36px', borderRadius: 8,
                fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '1.1rem',
                textTransform: 'uppercase', letterSpacing: '.08em', textDecoration: 'none',
                animation: 'glow 2s ease-in-out infinite',
              }}>Register for Tryouts</a>
              <a href="#" style={{
                background: 'transparent', color: '#fff', padding: '16px 36px', borderRadius: 8,
                fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '1.1rem',
                textTransform: 'uppercase', letterSpacing: '.08em', textDecoration: 'none',
                border: '2px solid rgba(255,255,255,.3)',
              }}>Contact Us</a>
            </div>
          </div>
        </section>
      );
    }

    /* ── Footer ───────────────────────────────── */
    function Footer() {
      const links = {
        'Quick Links': ['Home', 'Teams', 'Schedule', 'News', 'Contact'],
        'Teams': ['10U Squirts', '14U Bantam', 'Coaches', 'Roster'],
        'Resources': ['Gear Store', 'Game Schedules', 'Photos', 'Sponsors'],
      };

      return (
        <footer style={{ background: 'var(--navy)', color: '#fff', padding: '64px 24px 32px' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 40, marginBottom: 48 }}>
              {/* Brand */}
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
                  <div style={{ fontSize: 32 }}>🏒</div>
                  <div>
                    <div style={{ fontFamily: 'var(--font-head)', fontWeight: 900, fontSize: '1.4rem', textTransform: 'uppercase', letterSpacing: '.05em' }}>Rinx HC</div>
                    <div style={{ fontSize: '.75rem', color: 'var(--red)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.15em' }}>Travel Hockey</div>
                  </div>
                </div>
                <p style={{ color: 'rgba(255,255,255,.5)', fontSize: '.85rem', lineHeight: 1.7, marginBottom: 16 }}>
                  Building competitive hockey players and great teammates on Long Island since 2018.
                </p>
                <div style={{ display: 'flex', gap: 12 }}>
                  {['📘', '📸', '🐦'].map((icon, i) => (
                    <a key={i} href="#" style={{
                      width: 36, height: 36, borderRadius: 8, background: 'rgba(255,255,255,.1)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16,
                      textDecoration: 'none', transition: 'all .2s',
                    }}>{icon}</a>
                  ))}
                </div>
              </div>

              {/* Link columns */}
              {Object.entries(links).map(([title, items]) => (
                <div key={title}>
                  <div style={{ fontFamily: 'var(--font-head)', fontWeight: 800, fontSize: '.85rem', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: 16, color: 'var(--red)' }}>{title}</div>
                  {items.map(item => (
                    <a key={item} href="#" style={{ display: 'block', color: 'rgba(255,255,255,.6)', fontSize: '.85rem', padding: '4px 0', textDecoration: 'none', transition: 'color .15s' }}
                      onMouseOver={e => e.currentTarget.style.color = '#fff'}
                      onMouseOut={e => e.currentTarget.style.color = 'rgba(255,255,255,.6)'}>{item}</a>
                  ))}
                </div>
              ))}
            </div>

            {/* Bottom bar */}
            <div style={{
              borderTop: '1px solid rgba(255,255,255,.1)', paddingTop: 24,
              display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12,
            }}>
              <p style={{ color: 'rgba(255,255,255,.4)', fontSize: '.8rem', margin: 0 }}>
                © 2026 Rinx Hockey Club. All rights reserved.
              </p>
              <p style={{ color: 'rgba(255,255,255,.3)', fontSize: '.75rem', margin: 0 }}>
                The Rinx, Hauppauge, NY · Built with React ⚛️
              </p>
            </div>
          </div>
        </footer>
      );
    }

    /* ══════════════════════════════════════════════
       APP
       ══════════════════════════════════════════════ */

    function App() {
      const [loaded, setLoaded] = useState(false);
      useEffect(() => { setLoaded(true); }, []);

      return (
        <div style={{ opacity: loaded ? 1 : 0, transition: 'opacity .5s' }}>
          <NewsTicker />
          <Navbar />
          <Hero />
          <QuickLinks />
          <TeamsSection />
          <RecentResults />
          <Schedule />
          <NewsSection />
          <SponsorsSection />
          <CTABanner />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
