name: Trophy Room gallery

# Upload banners to images/trophyroom-10u/ or images/trophyroom-14u/, and
# photos to their gallery/ subfolders, on main; this builds the web copies and
# the list the Trophy Room page reads (data/trophy-room.json).

on:
  push:
    branches: [main]
    paths:
      - 'images/trophyroom-*/**'
      - '.github/scripts/trophy_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trophy-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools
        run: pip install pillow pillow-heif

      - name: Build gallery
        run: python .github/scripts/trophy_gallery.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A images/trophy-room data/trophy-room.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Trophy Room gallery [skip ci]"
          # The schedule job may have pushed in the meantime.
          git pull --rebase origin main
          git push
