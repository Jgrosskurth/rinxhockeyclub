name: Update Schedule & Stats from MHR/Ayrabo

# Daily scraping is disabled: the Schedule and Stats pages now embed live
# GameSheet data via iframes, so the MHR/Ayrabo scrapers are no longer needed
# and would overwrite the 10U schedule page. Kept as a manual-only workflow in
# case we need to regenerate the legacy native tables.
on:
  workflow_dispatch: # manual trigger only

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape MHR schedule and update DA
        env:
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
        run: node scripts/update-schedule.js

      - name: Scrape Ayrabo stats and update CSV
        env:
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
        run: node scripts/update-stats.js
