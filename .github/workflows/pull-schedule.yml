name: Pull GameSheet Schedule

# Pulls 10U and 14U schedules/results from GameSheet into data/*.json, which
# the native schedule block on the site fetches directly. Runs twice daily
# (10:00 and 22:00 ET) plus on-demand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'   # 10:00 ET (14:00 UTC)
    - cron: '0 2 * * *'    # 22:00 ET (02:00 UTC)

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Pull 10U schedule
        run: |
          python pull_gamesheet_schedule.py \
            --season 15381 --team 555061 --division 83000 \
            --out data/schedule-10u.json

      - name: Pull 14U schedule
        run: |
          python pull_gamesheet_schedule.py \
            --season 15381 --team 555117 --division 83002 \
            --out data/schedule-14u.json

      - name: Show results
        run: |
          echo "----- 10U -----"; head -12 data/schedule-10u.json
          echo "----- 14U -----"; head -12 data/schedule-14u.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule-10u.json data/schedule-14u.json
          git commit -m "Update GameSheet schedule data [skip ci]" || echo "No changes to commit"
          git push
