name: Pull GameSheet Data

# Pulls schedule, stats, and standings for 10U and 14U (plus tournament
# schedules) from GameSheet into data/*.json, which the native blocks on the
# site fetch directly, and rebuilds the subscribable team calendars
# (data/calendar-*.ics). Runs twice daily (10:00 and 22:00 ET), every 30
# minutes during game hours on Friday evenings and weekends, and on demand
# from the Actions tab. (GitHub may start scheduled runs a few minutes late.)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'           # 10:00 ET (14:00 UTC)
    - cron: '0 2 * * *'            # 22:00 ET (02:00 UTC)
    # Game days, every 30 min (UTC; ~7:00-23:00 ET on Sat/Sun, 17:00-23:00 ET Fri)
    - cron: '*/30 11-23 * * 0,6'   # Sat & Sun daytime
    - cron: '*/30 0-3 * * 0,1'     # Sat & Sun evenings (past midnight UTC)
    - cron: '*/30 21-23 * * 5'     # Fri late afternoon
    - cron: '*/30 0-3 * * 6'       # Fri evening (past midnight UTC)

permissions:
  contents: write

# One pull at a time; a run that starts while another is going waits for it.
concurrency:
  group: gamesheet-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Pull 10U (team 555061, div 83000)
        run: |
          python pull_gamesheet.py --type schedule  --season 15381 --team 555061 --division 83000 --out data/schedule-10u.json
          python pull_gamesheet.py --type stats      --season 15381 --team 555061 --division 83000 --out data/stats-10u.json
          python pull_gamesheet.py --type standings  --season 15381 --team 555061 --division 83000 --out data/standings-10u.json
          python pull_gamesheet.py --type games      --season 15381 --division 83000 --out data/games-10u.json

      - name: Pull 14U (team 555117, div 83002)
        run: |
          python pull_gamesheet.py --type schedule  --season 15381 --team 555117 --division 83002 --out data/schedule-14u.json
          python pull_gamesheet.py --type stats      --season 15381 --team 555117 --division 83002 --out data/stats-14u.json
          python pull_gamesheet.py --type standings  --season 15381 --team 555117 --division 83002 --out data/standings-14u.json
          python pull_gamesheet.py --type games      --season 15381 --division 83002 --out data/games-14u.json

      - name: Pull Mid-Atlantic Fall Showcase (season 16150, team 573565)
        run: |
          python pull_gamesheet.py --type schedule  --season 16150 --team 573565 --out data/schedule-mid-atlantic.json
          python pull_gamesheet.py --type stats      --season 16150 --team 573565 --out data/stats-mid-atlantic.json
          python pull_gamesheet.py --type standings  --season 16150 --team 573565 --out data/standings-mid-atlantic.json

      # Box scores for the /box-score page. GameSheet's game pages need real
      # Chrome (preinstalled on the runner) under a virtual display to clear
      # Cloudflare. Games already saved are skipped, so this opens a browser
      # only when a new tournament game is final. A failure leaves the saved
      # box scores as they are and doesn't stop the rest of the pull.
      - name: Mid-Atlantic box scores (GameSheet game pages)
        continue-on-error: true
        env:
          REAL_CHROME: '1'
        run: |
          xvfb-run -a python .github/scripts/pull_gamesheet_boxscores.py --season 16150 --schedule data/schedule-mid-atlantic.json --out data/boxscores-mid-atlantic.json

      - name: League player stats from LIHockey.com box scores
        run: python .github/scripts/pull_lihockey.py

      - name: Fill in league games GameSheet doesn't list, from LIHockey.com
        run: python .github/scripts/fill_league_games.py

      - name: Pull stats for GameSheet team pages linked in the other-games sheet
        run: python .github/scripts/pull_sheet_stats.py

      - name: Homepage Game Update cards (LI Hockey recaps, GameSheet box scores)
        run: python .github/scripts/build_news.py

      - name: Build team calendars
        run: python .github/scripts/build_calendars.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.ics
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update GameSheet data [skip ci]"
          # The Trophy Room job (or a manual edit) may have pushed meanwhile.
          git pull --rebase origin main
          git push
