name: Box scores first pull (temporary)
on:
  push:
    branches: [tournament-box-scores]
    paths: ['.github/scripts/pull_gamesheet_boxscores.py', '.github/scripts/gamesheet/**', '.github/workflows/probe-gamesheet-game.yml']
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: REAL_CHROME=1 xvfb-run -a python .github/scripts/pull_gamesheet_boxscores.py --season 16150 --schedule data/schedule-mid-atlantic.json --out data/boxscores-mid-atlantic.json
      - uses: actions/upload-artifact@v4
        with:
          name: boxscores
          path: data/boxscores-mid-atlantic.json
