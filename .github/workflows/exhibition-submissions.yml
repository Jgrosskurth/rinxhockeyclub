name: Exhibition Game Submissions

# Copies exhibition games sent in through the /submit-game form (stored in the
# club's Google Sheet, see tools/game-submissions/) into
# data/submitted-games.json, which the schedule, standings and homepage read.
# Runs every 15 minutes, right after a submission when the sheet's script has
# a GITHUB_TOKEN, and on demand from the Actions tab. The team calendars pick
# the games up on the next GameSheet pull.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [game-submitted]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: game-submissions
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read submissions
        run: python3 .github/scripts/pull_submissions.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/submitted-games.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update submitted exhibition games [skip ci]"
          # The GameSheet or Trophy Room job may have pushed meanwhile.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
