# Runs twice a day: refreshes ig/feed.json + thumbnails (fetch-instagram.mjs,
# via Apify) for the homepage Instagram block, and commits if they changed.
name: Update Instagram feed
on:
  schedule:
    - cron: "0 14,2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-instagram.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - run: |
          git config user.name "ig-feed-bot"
          git config user.email "ig-feed-bot@users.noreply.github.com"
          git add -A ig
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update Instagram feed"
          # The GameSheet pull may have pushed meanwhile.
          git pull --rebase --autostash origin main
          git push
