# Save as .github/workflows/update-instagram.yml in your site repo.
# Runs twice a day, refreshes ig/feed.json + thumbnails, commits if changed.
name: Update Instagram feed
on:
  schedule:
    - cron: "0 14,2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-instagram.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - run: |
          git config user.name "ig-feed-bot"
          git config user.email "ig-feed-bot@users.noreply.github.com"
          git add ig
          git diff --cached --quiet || (git commit -m "Update Instagram feed" && git push)
