name: Pull MyHockeyRankings games

# A check on the site's other game sources: reads the 10U and 14U team pages
# on MyHockeyRankings through the club's Apify account
# (.github/scripts/pull_mhr.py) into data/mhr-<team>.json. The site adds any
# finished game listed there that GameSheet, LI Hockey, the other-games sheet
# and the game form all miss. Twice a day (8:30 and 20:30 ET), and on demand
# from the Actions tab. The calendars pick the games up on the next GameSheet
# pull.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'   # 08:30 ET (12:30 UTC)
    - cron: '30 0 * * *'    # 20:30 ET (00:30 UTC)

permissions:
  contents: write

concurrency:
  group: mhr-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read MyHockeyRankings team pages (via Apify)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python .github/scripts/pull_mhr.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mhr-*.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Update MyHockeyRankings games [skip ci]"
          # The GameSheet pull may have pushed meanwhile.
          git pull --rebase --autostash origin main
          git push
